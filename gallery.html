    <title>随机图片墙</title>
    <style>
        body { font-family: system-ui; background: #f2f2f2; padding: 12px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; }
        .gallery img { width: 100%; height: 150px; object-fit: cover; border-radius: 12px; }
        h1 { text-align: center; font-size: 1.4rem; margin: 0 0 6px; }
        .info { text-align: center; color: gray; font-size: 0.8rem; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h1>🖼️ 随机图片墙</h1>
    <div class="info">✨ 每次打开顺序都会重新打乱 ✨</div>

        ];

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function displayImages() {
            const shuffled = shuffleArray([...imageUrls]);
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            shuffled.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.loading = 'lazy';
                gallery.appendChild(img);
            });
        }

        displayImages();
    </script>
